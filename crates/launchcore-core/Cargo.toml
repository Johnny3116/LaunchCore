[package]
name = "launchcore-core"
version = "0.1.0"
edition = "2021"
description = "Platform-independent LaunchCore logic: catalog model, validation, signature verification, versions, paths"

[dependencies]
base64 = "=0.23.1"
ed25519-dalek = { version = "=3.0.0", default-features = false, features = ["fast"] }
hex = "=0.4.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "=0.11.1"
thiserror = "=2.0.21"
